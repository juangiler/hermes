name: Release preparation

# Hermes has no public binary channel yet. Manual artifacts only: no release
# publication, package-repository credentials, upstream OBS calls or tag deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata and generated branding
        run: |
          sh tools/check-release-version.sh
          python3 tools/branding-selftest.py
          python3 tools/build-install-selftest.py
      - name: Source archive
        run: sh tools/source-archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-source
          path: dist/hermes-*.tar.gz
