name: CI

on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-install-selftest.py
      - run: python3 tools/branding-selftest.py
      - run: python3 tools/legacy-purge-selftest.py
      - run: git diff --exit-code

  package-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release versions
        run: sh tools/check-release-version.sh

  # Portable build on the distros SDL 3.2+ is packaged for; warnings fail the job.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, fedora:latest, debian:trixie, ubuntu:26.04]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          case "${{ matrix.image }}" in
            archlinux*) pacman -Syu --noconfirm --needed base-devel git pkgconf cmake sdl3 freetype2 harfbuzz fontconfig libarchive libvterm fuse3 openssl qt6-base qt6-declarative kirigami extra-cmake-modules qqc2-desktop-style ;;
            fedora*)    dnf install -y gcc git pkgconf-pkg-config cmake SDL3-devel freetype-devel harfbuzz-devel fontconfig-devel libarchive-devel libvterm-devel fuse3-devel openssl-devel qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel extra-cmake-modules kf6-qqc2-desktop-style ;;
            debian*|ubuntu*)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git pkg-config cmake libsdl3-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev libarchive-dev libvterm-dev libfuse3-dev libssl-dev qt6-base-dev qt6-declarative-dev libkirigami-dev extra-cmake-modules qml6-module-org-kde-kirigami qml6-module-org-kde-desktop ;;
          esac
      - uses: actions/checkout@v4
      - name: Build (package mode)
        run: |
          ./build.sh package 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then echo "::error::compiler warnings"; exit 1; fi
          ./build/package/hermes --version
      - name: Build both UIs (CMake)
        run: |
          cmake -S . -B build/cmake-ui -DHERMES_BUILD_QT_UI=ON -DHERMES_DEFAULT_UI=legacy
          cmake --build build/cmake-ui --target hermes-legacy hermes-qt hermes-qt-selftest 2>&1 | tee cmake-ui-build.log
          if grep -q 'warning:' cmake-ui-build.log; then echo "::error::Qt UI compiler warnings"; exit 1; fi
          QT_QPA_PLATFORM=offscreen ./build/cmake-ui/hermes-qt-selftest
          cmake -S . -B build/cmake-ui-qt -DHERMES_BUILD_QT_UI=ON -DHERMES_DEFAULT_UI=kirigami
          cmake --build build/cmake-ui-qt --target hermes-qt

  # Informational only until phase 5 of the Qt/Kirigami port: exercises the
  # headless core library that the future frontend will link against.
  core-selftest:
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --shm-size=2g # the cross-device copy test uses /dev/shm
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf cmake libarchive fuse3 openssl qt6-base
      - uses: actions/checkout@v4
      - name: Headless core self-test (non-root)
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c '
            set -e
            cmake -S . -B build/cmake -DHERMES_BUILD_QT_UI=OFF
            cmake --build build/cmake --target hermes-core-selftest hermes-core-abi-selftest hermes-cpp-probe
            ./build/cmake/hermes-core-selftest
            ./build/cmake/hermes-core-abi-selftest
            ./build/cmake/hermes-cpp-probe'

  # Informational until the Qt/Kirigami port lands: headless portal harness.
  # This job reports failures normally; it is not yet a required check.
  portal-selftest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf cmake libarchive fuse3 openssl qt6-base dbus
      - uses: actions/checkout@v4
      - name: Headless portal self-test (non-root)
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c '
            set -e
            cmake -S . -B build/cmake -DHERMES_BUILD_QT_UI=OFF
            sh tools/portal-selftest.sh'

  # Debug build (ASan/UBSan) + the headless self-tests. A restricted seccomp profile
  # can make LeakSanitizer print a ptrace warning and "Child exited with signal 32";
  # suite exit codes are authoritative. Keep leak detection on; see docs/building.md.
  selftest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --shm-size=2g # the cross-device copy tests use /dev/shm (64 MB by default in containers)
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf sdl3 freetype2 harfbuzz fontconfig libarchive libvterm fuse3 openssl ttf-dejavu shared-mime-info vim # (m8: file types, an app for text)
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: ./build.sh debug
      - name: Self-tests
        # As a normal user: root ignores file permissions, which the "permission denied" tests rely on.
        # (--selftest-devices needs FUSE, which containers don't have)
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c '
            set -e
            sh tools/mkfiles.sh /tmp/fe-st 5000
            ./build/debug/hermes --selftest /tmp/fe-st
            for t in ops admin git grep du cmp m4 m5 m6 m7 m8 m9 m10 m11; do
              echo "::group::selftest-$t"
              ./build/debug/hermes --selftest-$t || { echo "::error::selftest-$t failed"; exit 1; }
              echo "::endgroup::"
            done'
      - name: Screenshot
        run: su tester -c './build/debug/hermes --screenshot shot.bmp /usr'
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shot.bmp
